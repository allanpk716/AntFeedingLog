name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只读权限：本流水线只跑测试与构建，不发布、不上传任何产物
permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Frontend tests (Vitest)
        run: pnpm test

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri

      - name: Build Tauri app (build only, no release)
        # 票 02：tauri.conf.json 已开 bundle.createUpdaterArtifacts（发版签名用），
        # 但本流水线只读、没有签名私钥（TAURI_SIGNING_PRIVATE_KEY 只在 tag 发布
        # job 的 Secrets 注入）——不覆盖关闭的话 updater 产物在签名步直接失败。
        # 这里用 --config 覆盖只关本次构建的 updater 产物，conf 文件本身不动。
        # 2026-09-19 修复：内联 JSON 经 pnpm 的 Windows 命令行中转会丢双引号
        # （6039c8d CI 实证 "key must be a string"），改写临时文件传路径。
        run: |
          printf '%s' '{"bundle":{"createUpdaterArtifacts":false}}' > .tauri-ci.config.json
          pnpm tauri build --config .tauri-ci.config.json
