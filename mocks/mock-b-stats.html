<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>蚂蚁饲养日志 · mock B（统计页）</title>
<style>
:root{
  --bg:#f6f4f1; --card:#ffffff; --tile:#faf8f5; --text:#2c2822; --muted:#8f887d;
  --border:#e8e2d8; --border-strong:#d8d1c4;
  --accent:#d97706; --accent-deep:#b45309; --accent-soft:#fdf1de;
  --ok:#188a4b; --ok-soft:#e7f5ec;
  --shadow:0 1px 2px rgba(60,50,30,.05),0 4px 14px rgba(60,50,30,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55}
main{max-width:1080px;margin:0 auto;padding:0 20px 80px}

/* ── 顶栏（与 mock A 一致） ── */
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--border)}
.hbar{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.brand{font-size:17px;font-weight:700;white-space:nowrap}
.today{font-size:12px;color:var(--muted);white-space:nowrap}
nav{display:flex;gap:4px;margin-left:8px}
.tab{padding:5px 14px;border-radius:999px;cursor:pointer;color:var(--muted)}
.tab.active{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.tools{margin-left:auto;display:flex;gap:8px}
.ghost-btn{padding:5px 12px;border:1px solid var(--border-strong);border-radius:8px;cursor:pointer;color:var(--text);font-size:13px;background:var(--card)}

/* ── 筛选行 ── */
.filters{display:flex;align-items:center;gap:12px;margin:20px 0 4px;flex-wrap:wrap}
.ctabs{display:flex;gap:6px;background:var(--tile);border:1px solid var(--border);border-radius:10px;padding:3px}
.ctab{padding:4px 14px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted)}
.ctab.active{background:var(--card);color:var(--accent-deep);font-weight:600;box-shadow:0 1px 3px rgba(60,50,30,.1)}
select{padding:6px 10px;border:1px solid var(--border-strong);border-radius:9px;font:inherit;background:var(--card);color:var(--text)}

/* ── KPI ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .n{font-size:26px;font-weight:800}
.kpi .n small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .l{font-size:12px;color:var(--muted);margin-top:2px}

/* ── 卡片 ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-top:14px}
.card h3{font-size:15px;display:flex;align-items:baseline;gap:10px}
.card h3 .hint{font-size:12px;font-weight:400;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1.6fr;gap:14px}
@media (max-width:820px){.row2{grid-template-columns:1fr}}
.foot-note{font-size:12px;color:var(--muted);margin-top:10px}

/* ── 热力图 ── */
.heat-area{margin-top:14px;overflow-x:auto}
.months{position:relative;height:18px;margin-left:24px}
.months span{position:absolute;top:0;font-size:11px;color:var(--muted)}
.heat-flex{display:flex;gap:5px}
.wdays{display:grid;grid-template-rows:repeat(7,13px);gap:3px;font-size:10px;color:var(--muted);width:19px}
.wdays div{height:13px;line-height:13px}
#heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px}
.cell{width:13px;height:13px;border-radius:3px;background:var(--tile)}
.cell.l0{background:#ece8e1}
.cell.l1{background:#f5d9a4}
.cell.l2{background:#e9b45f}
.cell.l3{background:#d68a2a}
.cell.l4{background:#a34f06}
.legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:8px;margin-left:24px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ── 喂食构成 ── */
.donut-wrap{display:flex;align-items:center;gap:20px;margin-top:16px;flex-wrap:wrap}
.donut-box{position:relative;width:150px;height:150px;flex:none}
.donut{width:150px;height:150px;border-radius:50%}
.donut-center{position:absolute;inset:34px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-center b{font-size:20px}
.donut-center span{font-size:11px;color:var(--muted)}
.dlegend{list-style:none;font-size:13px}
.dlegend li{margin:7px 0;display:flex;align-items:center;gap:8px}
.dlegend .dot{width:10px;height:10px;border-radius:3px}
.dlegend b{font-size:15px}
.dlegend .lc{color:var(--muted);font-size:12px}

/* ── 每周柱状 ── */
.bars{display:flex;align-items:flex-end;gap:8px;height:160px;margin-top:16px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.b{width:100%;max-width:38px;background:linear-gradient(180deg,#e9a23f,#d6821f);border-radius:5px 5px 2px 2px;position:relative;min-height:2px}
.bv{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.bl{font-size:10px;color:var(--muted);margin-top:6px;height:13px}

/* ── 间隔统计 ── */
.irow{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.iname{width:110px;font-size:13px;flex:none}
.itrack{flex:1;min-width:180px;height:12px;background:var(--tile);border:1px solid var(--border);border-radius:999px;position:relative}
.ibar{height:100%;background:linear-gradient(90deg,#e9a23f,#c87412);border-radius:999px}
.imark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--accent-deep);border-radius:1px}
.imark::after{content:"建议";position:absolute;top:-16px;left:-9px;font-size:10px;color:var(--accent-deep)}
.itext{font-size:12px;color:var(--muted);flex:none}
.itext b{color:var(--text);font-size:13px}

/* tooltip / 水印 */
#tip{position:fixed;z-index:99;background:#2c2822;color:#fff;font-size:12px;padding:6px 10px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .1s;max-width:280px}
#tip.show{opacity:1}
.stamp{position:fixed;right:12px;bottom:10px;font-size:11px;color:var(--muted);opacity:.75;z-index:5}
</style>
</head>
<body>

<header><div class="hbar">
  <div class="brand">🐜 蚂蚁饲养日志</div>
  <nav>
    <span class="tab" data-hint="对应示意稿 mock-a-light.html / mock-a-dark.html">首页</span>
    <span class="tab active">统计</span>
    <span class="tab" data-hint="记录列表页：按窝/操作/时间筛选，备注可搜索">记录</span>
  </nav>
  <div class="today">2026-09-18 周五</div>
  <div class="tools"><span class="ghost-btn">⤓ 导出</span><span class="ghost-btn">⚙ 设置</span></div>
</div></header>

<main>

  <div class="filters">
    <div class="ctabs" id="ctabs">
      <span class="ctab active" data-c="all">全部</span>
      <span class="ctab" data-c="c1">大头一号</span>
      <span class="ctab" data-c="c2">针毛</span>
      <span class="ctab" data-c="c3">大头二号（冬眠）</span>
    </div>
    <select id="range">
      <option value="180" selected>近 6 个月</option>
      <option value="90">近 3 个月</option>
    </select>
  </div>

  <div class="kpis" id="kpis"></div>

  <section class="card">
    <h3>日历热力图 <span class="hint">一格一天，颜色越深当天操作越多 · 悬停看明细</span></h3>
    <div class="heat-area">
      <div class="months" id="months"></div>
      <div class="heat-flex">
        <div class="wdays"><div>一</div><div></div><div>三</div><div></div><div>五</div><div></div><div>日</div></div>
        <div id="heat"></div>
      </div>
      <div class="legend">少 <i style="background:#ece8e1"></i><i style="background:#f5d9a4"></i><i style="background:#e9b45f"></i><i style="background:#d68a2a"></i><i style="background:#a34f06"></i> 多</div>
    </div>
  </section>

  <div class="row2">
    <section class="card">
      <h3>喂食构成 <span class="hint">按食物出现次数</span></h3>
      <div class="donut-wrap">
        <div class="donut-box"><div class="donut" id="donut"></div><div class="donut-center"><b id="feedTotal">0</b><span>次投喂</span></div></div>
        <ul class="dlegend" id="dlegend"></ul>
      </div>
    </section>
    <section class="card">
      <h3>每周操作次数 <span class="hint">最近 12 周</span></h3>
      <div class="bars" id="bars"></div>
    </section>
  </div>

  <section class="card">
    <h3>实际间隔 vs 建议间隔 <span class="hint">竖线 = 建议间隔，仅提醒类（喂食、垃圾清理）</span></h3>
    <div id="intervals"></div>
    <div class="foot-note">注：正式版会把冬眠期从间隔统计中剔除（否则冬眠停食会拉长"最长"数字）。</div>
  </section>

</main>

<div id="tip"></div>
<div class="stamp">静态示意稿 · 假数据 · mock-b-stats</div>

<script>
/* ── 假数据：种子随机数，每次打开结果一致 ── */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ACTIONS=[['feed','喂食'],['water','活动区换水'],['hydrate','巢穴保湿'],['trash','垃圾清理']];
const ACT_ICON={feed:'🌾',water:'💧',hydrate:'🌫️',trash:'🧹'};
const ACT_NAME=Object.fromEntries(ACTIONS);
const SUGG={feed:3,water:3,hydrate:5,trash:7};
const REMIND={feed:true,water:false,hydrate:false,trash:true}; // 提醒类 / 仅登记类
const FOODS=[['种子','#d97706'],['面包虫','#8b5e34'],['干虾仁','#4a90d9']];
const FOOD_W=[.40,.35,.25];

const START=new Date(2026,2,23); // 周一
const END=new Date(2026,8,18);
const DAYS=Math.round((END-START)/86400000)+1;

const CFG={
  c1:{name:'大头一号',seed:101,rates:{feed:.55,water:.38,hydrate:.32,trash:.20}},
  c2:{name:'针毛',   seed:202,rates:{feed:.45,water:.30,hydrate:.36,trash:.16}},
  c3:{name:'大头二号',seed:303,rates:{feed:.50,water:.35,hydrate:.30,trash:.18},hibFrom:new Date(2026,7,20)},
};
function pickFood(rnd){let r=rnd(),acc=0;for(let i=0;i<FOOD_W.length;i++){acc+=FOOD_W[i];if(r<acc)return FOODS[i][0];}return '种子';}
function gen(cfg){
  const rnd=mulberry32(cfg.seed),days=[];
  for(let i=0;i<DAYS;i++){
    const d=new Date(START.getFullYear(),START.getMonth(),START.getDate()+i);
    const m=d.getMonth();
    const hib=cfg.hibFrom&&d>=cfg.hibFrom;
    const acts=[];
    for(const [k] of ACTIONS){
      let p=cfg.rates[k]*(m>=4&&m<=6?1.15:1);
      if(hib)p=k==='trash'?.02:.03;
      if(rnd()<p)acts.push(k);
    }
    days.push({d,acts:acts.map(a=>{
      if(a!=='feed')return{a};
      let f;
      if(rnd()<.6)f=[pickFood(rnd)];
      else{const x=pickFood(rnd),y=pickFood(rnd);f=x===y?[x]:[x,y];}
      return{a,foods:f};
    })});
  }
  return days;
}
const DATA={c1:gen(CFG.c1),c2:gen(CFG.c2),c3:gen(CFG.c3)};
DATA.all=DATA.c1.map((x,i)=>({d:x.d,acts:[].concat(x.acts,DATA.c2[i].acts,DATA.c3[i].acts)}));

let cur='all',range=180;
const $=s=>document.querySelector(s);
const fmtMD=d=>`${d.getMonth()+1}/${d.getDate()}`;
const fmtFull=d=>`${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} 周${'日一二三四五六'[d.getDay()]}`;

function filtered(){
  const cutoff=new Date(END);cutoff.setDate(cutoff.getDate()-range+1);
  cutoff.setDate(cutoff.getDate()-((cutoff.getDay()+6)%7)); // 对齐周一
  return DATA[cur].filter(x=>x.d>=cutoff);
}

/* KPI */
function renderKpis(days){
  const total=days.reduce((s,x)=>s+x.acts.length,0);
  const feed=days.reduce((s,x)=>s+x.acts.filter(a=>a.a==='feed').length,0);
  const hd=days.filter(x=>x.acts.some(a=>a.a==='hydrate')).map(x=>x.d);
  const gaps=[];for(let i=1;i<hd.length;i++)gaps.push((hd[i]-hd[i-1])/86400000);
  const avg=gaps.length?(gaps.reduce((a,b)=>a+b,0)/gaps.length).toFixed(1):'—';
  const sepTrash=days.filter(x=>x.d.getMonth()===8).reduce((s,x)=>s+x.acts.filter(a=>a.a==='trash').length,0);
  $('#kpis').innerHTML=[
    [total,'条','记录总数'],
    [feed,'次','喂食'],
    [avg,'天','平均保湿间隔'],
    [sepTrash,'次','9 月垃圾清理'],
  ].map(([n,u,l])=>`<div class="kpi"><div class="n">${n}<small> ${u}</small></div><div class="l">${l}</div></div>`).join('');
}

/* 热力图 */
function renderHeat(days){
  const heat=$('#heat');heat.innerHTML='';
  const weeks=Math.ceil(days.length/7);
  days.forEach(x=>{
    const c=document.createElement('div');
    const n=x.acts.length;
    const lv=n===0?0:n===1?1:n===2?2:n<=4?3:4;
    c.className='cell l'+lv;
    if(n===0)c.dataset.tip=`${fmtFull(x.d)} · 无记录`;
    else{
      const items=x.acts.slice(0,4).map(a=>a.foods?`${ACT_NAME[a.a]}（${a.foods.join('、')}）`:ACT_NAME[a.a]);
      c.dataset.tip=`${fmtFull(x.d)} · ${n} 次：${items.join('、')}${x.acts.length>4?'…':''}`;
    }
    heat.appendChild(c);
  });
  /* 月份标签 */
  const mrow=$('#months');mrow.innerHTML='';
  let prevM=-1;
  for(let w=0;w<weeks;w++){
    const d=days[w*7];if(!d)break;
    if(d.d.getMonth()!==prevM){
      prevM=d.d.getMonth();
      const s=document.createElement('span');
      s.textContent=`${d.d.getMonth()+1}月`;
      s.style.left=(w*16)+'px';
      mrow.appendChild(s);
    }
  }
}

/* 喂食构成 */
function renderDonut(days){
  const cnt={};
  days.forEach(x=>x.acts.forEach(a=>a.foods&&a.foods.forEach(f=>cnt[f]=(cnt[f]||0)+1))));
  const entries=FOODS.map(([n,c])=>[n,c,cnt[n]||0]);
  const total=entries.reduce((s,e)=>s+e[2],0)||1;
  let acc=0;
  const stops=entries.map(([n,c,k])=>{const from=acc/total*100;acc+=k;return `${c} ${from}% ${acc/total*100}%`;});
  $('#donut').style.background=`conic-gradient(${stops.join(',')})`;
  $('#feedTotal').textContent=total;
  $('#dlegend').innerHTML=entries.map(([n,c,k])=>`<li><span class="dot" style="background:${c}"></span>${n} <b>${Math.round(k/total*100)}%</b><span class="lc">${k} 次</span></li>`).join('');
}

/* 每周柱状 */
function renderBars(days){
  const weeks=[];for(let i=0;i<days.length;i+=7)weeks.push(days.slice(i,i+7));
  const last12=weeks.slice(-12);
  const counts=last12.map(w=>w.reduce((s,x)=>s+x.acts.length,0));
  const max=Math.max(...counts,1);
  $('#bars').innerHTML=counts.map((c,i)=>
    `<div class="bcol"><div class="b" style="height:${Math.max(c/max*100,2)}%"><span class="bv">${c}</span></div><span class="bl">${i%2===1&&last12[i]?fmtMD(last12[i][0].d):''}</span></div>`
  ).join('');
}

/* 间隔统计 */
function renderIntervals(days){
  const html=[];
  for(const [k,label] of ACTIONS){
    const dates=days.filter(x=>x.acts.some(a=>a.a===k)).map(x=>x.d);
    const gaps=[];for(let i=1;i<dates.length;i++)gaps.push((dates[i]-dates[i-1])/86400000);
    if(gaps.length<2){html.push(`<div class="irow"><span class="iname">${ACT_ICON[k]} ${label}</span><span class="itext">记录不足</span></div>`);continue;}
    const avg=gaps.reduce((a,b)=>a+b,0)/gaps.length;
    const min=Math.min(...gaps),max=Math.max(...gaps),sugg=SUGG[k];
    const scale=Math.max(max*1.15,sugg*1.3);
    const mark=REMIND[k]?`<div class="imark" style="left:${(sugg/scale*100).toFixed(1)}%"></div>`:'';
    const tail=REMIND[k]?` · 建议 ${sugg} 天`:' · 仅登记';
    html.push(`<div class="irow">
      <span class="iname">${ACT_ICON[k]} ${label}</span>
      <div class="itrack"><div class="ibar" style="width:${(avg/scale*100).toFixed(1)}%"></div>${mark}</div>
      <span class="itext">平均 <b>${avg.toFixed(1)}</b> 天 · 最短 ${min} · 最长 ${max}${tail}</span>
    </div>`);
  }
  $('#intervals').innerHTML=html.join('');
}

function renderAll(){
  const days=filtered();
  renderKpis(days);renderHeat(days);renderDonut(days);renderBars(days);renderIntervals(days);
}

/* 事件 */
document.querySelectorAll('.ctab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.ctab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');cur=t.dataset.c;renderAll();
}));
$('#range').addEventListener('change',e=>{range=+e.target.value;renderAll();});
document.querySelectorAll('.tab[data-hint],.ghost-btn').forEach(el=>el.addEventListener('click',()=>alert(el.dataset.hint||'示意稿，无功能')));

/* 悬停提示 */
const tip=$('#tip');
$('#heat').addEventListener('mouseover',e=>{if(e.target.dataset.tip){tip.textContent=e.target.dataset.tip;tip.classList.add('show');}});
$('#heat').addEventListener('mousemove',e=>{tip.style.left=Math.min(e.clientX+14,innerWidth-260)+'px';tip.style.top=(e.clientY+16)+'px';});
$('#heat').addEventListener('mouseout',()=>tip.classList.remove('show'));

renderAll();
</script>
</body>
</html>
