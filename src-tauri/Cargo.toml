[package]
name = "ant-feeding-log"
version = "0.3.0"
description = "蚂蚁饲养记录：单用户本地工具，登记喂食/换水/保湿/清理并提醒"
authors = ["allan716"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ant_feeding_log_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# 单实例（数据安全二期票 01）：必须注册在 Builder 最前（插件文档要求）
tauri-plugin-single-instance = "2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = "2"
# 网页端访问凭证随机源（webui-checkin 票 03）：OS 级随机 ≥128bit，只程序生成
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# panic = "abort" 刻意不设（终局评审定点修 3）：提醒调度线程靠 catch_unwind
# 隔离单轮 panic，abort 会让它失效、panic 直接带走整个进程。
strip = true
